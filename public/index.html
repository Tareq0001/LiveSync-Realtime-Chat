<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveSync | Real-Time Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="login-box">
                <div class="logo">Live<span>Sync</span></div>
                <p>Enter a username to join the real-time server.</p>
                <input type="text" id="username-input" placeholder="e.g. Tareq" autocomplete="off" onkeypress="handleEnter(event, joinChat)">
                <button onclick="joinChat()" class="btn-primary">Connect to Server</button>
            </div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="screen">
            <div class="chat-header">
                <div class="header-info">
                    <div class="logo-small">Live<span>Sync</span></div>
                    <div class="status-indicator"><span class="dot"></span> Connected to Backend</div>
                </div>
                <button onclick="logout()" class="btn-outline">Leave</button>
            </div>
            
            <div class="chat-messages" id="messages-container">
                <!-- Messages injected here via WebSockets -->
            </div>

            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" onkeypress="handleEnter(event, sendMessage)">
                <button onclick="sendMessage()" class="btn-send">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
